name: fhir_r5_bulk
description: Library to support the FHIR Bulk Data Access API (https://www.hl7.org/fhir/uv/bulkdata/index.html) for FHIR R5 resources.
version: 0.4.1
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r5

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^4.0.7
  # fhir_r5: ^0.4.3
  fhir_r5:
    path: ../fhir_r5
  http: ^1.6.0
  mime: ^2.0.0
  universal_io: ^2.3.1

dev_dependencies:
  test: ^1.28.0
