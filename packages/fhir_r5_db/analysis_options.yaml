# One lint policy for the whole monorepo: very_good_analysis with the
# family-standard suppressions (see the root analysis_options.yaml).
include: ../../analysis_options.yaml

analyzer:
  exclude:
    # Generated by fhir_generator (generate_db_search_parameters.dart); it
    # carries a "Do not edit by hand" header and is regenerated from the FHIR
    # R5 SearchParameter definitions, so lint fixes belong in the generator,
    # not here. Hand-written sources in this package are all lint-clean.
    - lib/src/search/search_parameters.dart
