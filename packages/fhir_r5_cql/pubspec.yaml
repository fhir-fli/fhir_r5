name: fhir_r5_cql
description: >-
  FHIR R5 binding for the model-independent `cql` engine: the R5
  ModelResolver and TerminologyProvider implementations that let the CQL
  engine execute against FHIR R5 data.
version: 0.6.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/cql

environment:
  sdk: ^3.5.0

dependencies:
  cql:
    path: ../../../cql
  fhir_r5: ^0.5.0
  fhir_r5_path: ^0.5.0
  ucum: ^0.8.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.29.0
