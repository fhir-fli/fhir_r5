name: fhir_r5_cql
description: >-
  FHIR R5 binding for the model-independent `cql` engine: the R5
  ModelResolver and TerminologyProvider implementations that let the CQL
  engine execute against FHIR R5 data.
version: 0.8.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r5
issue_tracker: https://github.com/fhir-fli/fhir_r5/issues

topics:
  - fhir
  - hl7
  - healthcare
  - cql
  - interoperability

environment:
  sdk: ^3.5.0

dependencies:
  cql: ^0.6.0
  fhir_r5: ^0.8.0
  fhir_r5_path: ^0.8.0
  ucum: ^0.9.0
dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.0.0
